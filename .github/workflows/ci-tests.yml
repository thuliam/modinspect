name: ModInspect CI - Tests and Asset Guard

# Runs the isolated regression suite, the secret scan and the admin vendor asset guard on a clean checkout, on every PHP
# version the project supports (8.1 is the declared minimum, 8.4 is the newest we verify).
# NO deploy, NO secrets, NO connection to shared DEV or any hosting. The database is an ephemeral MariaDB service
# container that exists only for the duration of each job.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: modinspect-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: PHP ${{ matrix.php }} + MariaDB 10.6 regression suite
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3', '8.4']
    services:
      mariadb:
        image: mariadb:10.6
        env:
          # Ephemeral CI-only credential for a throwaway container; not a secret.
          MARIADB_ROOT_PASSWORD: ci-ephemeral-root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - name: Checkout tracked project files
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Guard - no environment files tracked
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)\.env(\..*)?$' | grep -vE '\.example$'; then
            echo "A real .env file is tracked." >&2
            exit 1
          fi

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, curl
          coverage: none
          tools: none

      - name: Secret scan (tracked files, values never printed)
        shell: bash
        run: php cli/secret_scan.php

      - name: Admin vendor asset guard (hash-pinned, official DataTables, licences recorded)
        shell: bash
        run: php cli/admin_vendor_manifest.php --verify

      - name: Create isolated test environment file
        shell: bash
        run: |
          set -euo pipefail
          cp .env.testing.example .env.testing
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-ephemeral-root/' .env.testing
          grep -E '^(DB_HOST|DB_DATABASE)=' .env.testing

      - name: Fresh install rehearsal (schema + migration data on an empty MariaDB database; development and production, each twice)
        # LS-17 D1 / LS-19 A1: schema.sql is the full structure, migrations add their data; production takes only the catalog from seed.sql and must
        # end with no public price. This proves the repository still builds a working database from nothing on the host's MariaDB 10.6.
        shell: bash
        env:
          MODINSPECT_ENV_FILE: .env.testing
        run: |
          set -euo pipefail
          php cli/rehearse_fresh_install.php modinspect_rehearsal
          php cli/rehearse_fresh_install.php modinspect_rehearsal
          php cli/rehearse_fresh_install.php modinspect_rehearsal --production
          php cli/rehearse_fresh_install.php modinspect_rehearsal --production

      - name: Bootstrap isolated test database
        shell: bash
        env:
          MODINSPECT_ENV_FILE: .env.testing
        run: php tests/bootstrap_test_db.php --fresh

      - name: Run regression suite
        shell: bash
        env:
          MODINSPECT_ENV_FILE: .env.testing
        run: php tests/run.php
